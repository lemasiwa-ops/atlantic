<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103c47">
  <title>Ask Atlantic | Atlantic Coast Tours</title>
  <style>
    /* Coastal style: deep Atlantic blue, sea-glass teal and warm sand. */
    :root {
      color-scheme: light;
      --ocean: #103c47;
      --teal: #006d70;
      --sand: #f6f2e9;
      --ink: #173943;
      --muted: #526970;
      --border: #d7e1e0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--sand);
    }

    button, input { font: inherit; }

    .chat {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: auto;
      background: #fbfcfb;
      overflow: hidden;
    }

    header {
      flex-shrink: 0;
      padding: 24px 20px;
      color: white;
      background: var(--ocean);
    }

    .brand {
      margin: 0 0 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #bde4dd;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.2rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #deeeeb;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 90%;
      align-self: flex-start;
      overflow-wrap: anywhere;
    }

    .message.user { align-self: flex-end; }

    .bubble {
      padding: 13px 16px;
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      background: white;
      line-height: 1.6;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .user .bubble {
      border-color: var(--teal);
      border-radius: 18px 18px 4px 18px;
      background: var(--teal);
      color: white;
    }

    .meta {
      display: block;
      margin: 6px 4px 0;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.4;
    }

    .thinking .bubble {
      background: #eaf3f1;
      color: var(--muted);
    }

    .error .bubble {
      color: #852f23;
      background: #fff3ef;
      border-color: #edc6bb;
    }

    footer {
      flex-shrink: 0;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: white;
      border-top: 1px solid var(--border);
    }

    form {
      display: flex;
      gap: 9px;
    }

    input {
      flex: 1;
      min-width: 0;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid #a7bcbc;
      border-radius: 12px;
      color: var(--ink);
      background: #fbfcfb;
      font-size: 16px;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #54b6aa;
      outline-offset: 3px;
    }

    button {
      min-height: 50px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--teal);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #005457; }
    button:disabled { opacity: 0.6; cursor: wait; }

    .note {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 0.73rem;
      line-height: 1.5;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 640px) {
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at top left, #d7e9e3, transparent 65%),
          var(--sand);
      }

      .chat {
        max-width: 760px;
        height: min(850px, calc(100dvh - 48px));
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 65px #103c4715;
      }

      header { padding: 28px; }
      .messages { padding: 28px; }
      .message { max-width: 84%; }
      footer { padding: 18px 24px; }
    }
  </style>
</head>
<body>
  <main class="chat" aria-label="Ask Atlantic customer chatbot">
    <header>
      <p class="brand">Atlantic Coast Tours · West of Ireland</p>
      <h1>Ask Atlantic</h1>
      <p class="subtitle">Your next adventure starts with a question.</p>
    </header>

    <section
      id="messages"
      class="messages"
      role="log"
      aria-label="Chat messages"
      aria-live="polite"
      aria-relevant="additions text"
    >
      <div class="message">
        <div class="bubble">Hello! Ask me about our tours, prices or spaces available. I’ll check the live catalogue with every question.</div>
      </div>
    </section>

    <footer>
      <form id="chat-form">
        <label for="question" class="sr-only">Your question</label>
        <input
          id="question"
          name="question"
          type="text"
          placeholder="Ask about a tour…"
          autocomplete="off"
          required
        >
        <button id="send" type="submit">Send</button>
      </form>
      <p class="note">Live catalogue checked with every question. Please confirm bookings with staff.</p>
    </footer>
  </main>

  <script>
    "use strict";

    const CATALOGUE_URL =
      "https://docs.google.com/spreadsheets/d/1balBGf8QhZ5dc-RCCAPt2kcrcf6m_YRh0HL_r8bBtJw/export?format=csv";

    const CHAT_URL = "https://luas-class.kluxy.app/chat";

    const SYSTEM = "You are Ask Atlantic, the customer assistant for Atlantic Coast Tours. Answer only from the live data you are given. Quote exact prices in euro and slots left. If something is not in the data, say so. If a value looks implausible, say so and suggest the customer checks with staff. Be warm and brief.";

    const form = document.getElementById("chat-form");
    const input = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const messages = document.getElementById("messages");

    let busy = false;

    function scrollToLatest() {
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(text, type = "assistant", timestamp = null) {
      const message = document.createElement("div");
      message.className = "message " + type;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      // Render all remote content as plain text.
      bubble.textContent = text;
      message.appendChild(bubble);

      if (timestamp) {
        const meta = document.createElement("small");
        meta.className = "meta";
        meta.textContent = "Data fetched live at " + timestamp;
        message.appendChild(meta);
      }

      messages.appendChild(message);
      scrollToLatest();
      return message;
    }

    function formatTime(date) {
      return [date.getHours(), date.getMinutes(), date.getSeconds()]
        .map(value => String(value).padStart(2, "0"))
        .join(":");
    }

    async function fetchText(url, options, label) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 45000);

      try {
        const response = await fetch(url, {
          ...options,
          signal: controller.signal
        });

        const body = await response.text();

        if (!response.ok) {
          let detail = "";

          try {
            const data = JSON.parse(body);
            if (typeof data.error === "string") detail = data.error;
            else if (typeof data.message === "string") detail = data.message;
            else if (typeof data.error?.message === "string") {
              detail = data.error.message;
            }
          } catch {
            detail = body.trim().slice(0, 200);
          }

          throw new Error(
            label + " failed (HTTP " + response.status + ")" +
            (detail ? ": " + detail : ".")
          );
        }

        return body;
      } catch (error) {
        if (error.name === "AbortError") {
          throw new Error(label + " timed out. Please try again.");
        }

        if (error instanceof TypeError) {
          throw new Error(
            label + " could not connect: " + error.message +
            ". Check your connection. The service may also be unavailable or blocking browser access (CORS)."
          );
        }

        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question || busy) return;

      busy = true;
      sendButton.disabled = true;
      input.readOnly = true;

      addMessage(question, "user");
      input.value = "";

      const thinking = addMessage("Thinking...", "thinking");

      try {
        // Fetch a fresh catalogue for this question; never reuse an earlier CSV.
        const csv = await fetchText(
          CATALOGUE_URL,
          { cache: "no-store" },
          "Live catalogue"
        );

        if (!csv.trim()) {
          throw new Error("The live catalogue is empty.");
        }

        if (/^\s*(?:<!doctype html|<html)/i.test(csv)) {
          throw new Error(
            "The catalogue returned a web page instead of CSV. Please check the spreadsheet's public sharing settings."
          );
        }

        // Record when the CSV finished downloading, before asking the brain.
        const fetchedAt = formatTime(new Date());

        const responseText = await fetchText(
          CHAT_URL,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              system: SYSTEM,
              messages: [
                {
                  role: "user",
                  content:
                    "Live data (CSV):\n" + csv +
                    "\n\nCustomer question: " + question
                }
              ]
            })
          },
          "Ask Atlantic"
        );

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error("Ask Atlantic returned an invalid JSON response.");
        }

        if (
          !data ||
          typeof data.reply !== "string" ||
          !data.reply.trim()
        ) {
          throw new Error(
            "Ask Atlantic returned no answer: the JSON response must contain a non-empty \"reply\" field."
          );
        }

        thinking.remove();
        addMessage(data.reply, "assistant", fetchedAt);
      } catch (error) {
        thinking.remove();
        addMessage(
          "Error: " + (error.message || String(error)),
          "error"
        );
      } finally {
        busy = false;
        sendButton.disabled = false;
        input.readOnly = false;
        input.focus();
        scrollToLatest();
      }
    });
  </script>
</body>
</html>
